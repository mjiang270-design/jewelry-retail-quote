<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>珠宝零售报价 · 简易版</title>
<style>
:root{color-scheme:light;--ink:#292d29;--muted:#62685e;--line:#d9ded3;--accent:#3c503c}*{box-sizing:border-box}body{margin:0;background:#f2f3ed;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1060px;margin:auto;padding:32px 24px 60px}header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}h1{font-size:25px;margin:0}header p{margin:5px 0 0;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:48px}h2{font-size:18px;margin:0 0 20px}label{display:block;font-size:14px;margin-bottom:16px}input,textarea,select{display:block;width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #b7bfb0;border-radius:6px;padding:11px;margin-top:6px}textarea{resize:vertical;min-height:82px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{font:inherit;cursor:pointer;border:1px solid var(--accent);border-radius:6px;padding:11px 16px;background:var(--accent);color:white;min-height:46px}button.secondary{background:transparent;color:var(--accent)}button:hover{filter:brightness(.92)}.actions{display:flex;gap:12px;flex-wrap:wrap}.formula{font-size:14px;color:var(--muted);margin:0 0 24px}.sheet{background:white;padding:32px;border-top:3px solid var(--accent)}.sheet h2{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:0}.meta{color:var(--muted);font-size:13px;margin:6px 0 26px}.line{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.line strong{font-variant-numeric:tabular-nums;white-space:nowrap}.total{padding-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.total strong{font-size:30px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px}.product-name{font-size:18px;font-weight:600;overflow-wrap:anywhere}.export{margin-top:20px;width:100%}#status{font-size:14px;color:var(--muted);min-height:24px}#image img{display:block;width:100%;margin-top:16px;border:1px solid var(--line)}[hidden]{display:none!important}::selection{background:#dae4d3} @media(max-width:720px){main{padding:22px 18px 40px}.layout{grid-template-columns:1fr;gap:32px}.sheet{padding:24px}.pair{gap:12px}h1{font-size:23px}}@media print{header,.editor,.export,#status,#image{display:none}.layout{display:block}body{background:white}main{padding:0}.sheet{border:0}}
@media(max-width:720px){body{line-height:1.4}main{padding:16px 16px 28px}header{padding-bottom:12px;margin-bottom:18px}header p{margin-top:3px}h2{margin-bottom:12px}.layout{gap:22px}label{margin-bottom:10px;font-size:13px}input,textarea,select{margin-top:4px;padding:8px 10px;font-size:16px;min-height:40px}textarea{min-height:64px}.pair{gap:10px}.formula{font-size:12px;margin-bottom:14px}.sheet{padding:18px}.sheet h2{font-size:24px}.sheet p{margin:8px 0}.sheet h3{margin:12px 0 8px}.meta{margin-bottom:16px}.line{padding:8px 0}.actions{gap:8px}.export{margin-top:12px}.description{font-size:13px}#cart p{margin:8px 0}#error:empty{display:none}#status{margin:8px 0;min-height:0}}
</style></head><body><main><header><h1>珠宝零售报价</h1><p>简易版 · 输入克重，即时计算</p></header><div class="layout"><section class="editor"><h2>报价信息</h2><p class="formula">零售价 = 基础金价 × 含金折算 × 报价克重 + 钻石报价</p><label>客户名称（选填）<input id="customer" autocomplete="off"></label><label>产品名称（选填）<input id="product" autocomplete="off"></label><div class="pair"><label>材质<select id="metal"><option value="9K">9K Gold</option><option value="10K">10K Gold</option><option value="14K">14K Gold</option><option value="18K" selected>18K Gold</option><option value="21K">21K Gold</option><option value="24K">24K Gold</option></select></label><label>含金折算（%）<input id="purity" type="number" step="any" value="75.5" inputmode="decimal"></label></div><div class="pair"><label>基础金价 / g<input id="goldPrice" type="number" step="any" value="950" inputmode="decimal"></label></div><p class="formula">报价克重仅供内部计价，客户报价单与图片始终显示实际克重。</p><div><label>实际克重（g）<input id="weight" type="number" step="any" inputmode="decimal" placeholder="输入克重"></label><label>报价克重（g，选填）<input id="quoteWeight" type="number" step="any" inputmode="decimal" placeholder="不填则使用实际克重"></label></div><div class="pair"><label>钻石单价 / ct（选填）<input id="diamond" type="number" step="any" inputmode="decimal" placeholder="例如 2800"></label><label>钻石卡数（ct，选填）<input id="carat" type="number" step="any" inputmode="decimal" placeholder="例如 0.34"></label></div><label>产品图片（选填）<input id="photo" type="file" accept="image/*"></label><img id="photoPreview" alt="产品图片" hidden style="max-width:160px;max-height:140px;object-fit:contain"><label>产品描述（选填）<textarea id="description"></textarea></label><div class="pair"><label>输入金额币种<select id="baseCurrency"><option>RMB</option><option>SAR</option><option>AED</option><option>USD</option></select></label><label>客户报价币种<select id="currency"><option>RMB</option><option>SAR</option><option>AED</option><option>USD</option></select></label></div><label id="rateField" hidden>换算汇率：1 <span id="fromCode"></span> = 多少 <span id="toCode"></span><input id="rate" type="number" step="any" inputmode="decimal" placeholder="输入本次使用的汇率"></label><p class="formula">基础金价与钻石报价使用同一输入币种。切换客户报价币种时按本次汇率换算。</p><div class="actions"><button type="button" id="add">加入本单</button><button type="button" id="clear" class="secondary">清空本次报价</button></div><section id="rmbSummary" style="background:#e8eee5;padding:16px;margin:18px 0;border-radius:8px"></section><div id="cart"></div><p id="error" role="alert"></p></section><section><div class="sheet" id="quote"><h2>Retail Quotation</h2><p class="meta" id="date"></p><div id="customerRow" class="line" hidden><span>Customer</span><strong id="customerOut"></strong></div><p id="productOut" class="product-name" hidden></p><p id="descriptionOut" class="description" hidden></p><div class="line"><span>Material</span><strong id="metalOut"></strong></div><div class="line"><span>Gold Weight</span><strong id="weightOut">—</strong></div><div class="line"><span>Gold Cost</span><strong id="goldOut">—</strong></div><div class="line" id="diamondRow" hidden><span>Diamond / Stone Cost</span><strong id="diamondOut"></strong></div><div class="total"><span>Total</span><strong id="totalOut">—</strong></div></div><button type="button" class="export" id="export">导出高清报价图片</button><p id="status" role="status"></p><div id="image"></div></section></div></main><script>
const $=id=>document.getElementById(id);let items=[],photoData='',editing=-1;const ids=['carat','customer','product','weight','diamond','description','currency','baseCurrency','metal','purity','goldPrice','quoteWeight','rate'];const purities={'9K':37.5,'10K':41.6667,'14K':58.5,'18K':75.5,'21K':87.5,'24K':99.9};
const number=v=>Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function model(){const read=id=>$(id).value.trim()===''?null:Number($(id).value);const weight=read('weight'),quoteWeight=read('quoteWeight')??weight,diamond=(read('diamond')??0)*(read('carat')??0),purity=read('purity'),price=read('goldPrice'),currency=$('currency').value,base=$('baseCurrency').value,rate=currency===base?1:read('rate');const valid=[weight,quoteWeight,diamond,purity,price,rate].every(v=>v===null||Number.isFinite(v));const ready=valid&&quoteWeight!==null&&purity!==null&&price!==null&&rate!==null;return {rawGold:quoteWeight===null||price===null||purity===null?null:price*purity/100*quoteWeight,rawDiamond:diamond,photo:photoData,carat:read('carat'),diamondPrice:read('diamond'),customer:$('customer').value.trim(),product:$('product').value.trim(),description:$('description').value.trim(),currency,base,rate,metal:$('metal').value,purity,weight,quoteWeight,diamond:diamond*(rate??1),gold:ready?price*purity/100*quoteWeight*rate:null,valid,ready}}
function money(v,m){return (m.currency?m.currency+' ':'')+number(v)}
function render(){$('rateField').hidden=$('baseCurrency').value===$('currency').value;$('fromCode').textContent=$('baseCurrency').value;$('toCode').textContent=$('currency').value;renderOrder()}
ids.forEach(id=>$(id).addEventListener('input',()=>{if(id==='metal')$('purity').value=purities[$('metal').value];if(id==='currency'||id==='baseCurrency')$('rate').value='';render()}));$('clear').onclick=()=>{ids.forEach(id=>{if(!['metal','purity','goldPrice','currency','baseCurrency','rate'].includes(id))$(id).value=''});render();$('weight').focus()};

function order(){return items.length?items:[model()]}
function renderOrder(){const q=$('quote');q.replaceChildren();const el=(tag,text,parent=q)=>{const n=document.createElement(tag);n.textContent=text;parent.appendChild(n);return n};el('h2','Retail Quotation');el('p',new Date().toLocaleDateString('en-GB'),q).className='meta';if($('customer').value)el('p','Customer: '+$('customer').value);let total=0;order().forEach((m,i)=>{const box=el('div','');box.style.cssText='padding:12px 0;border-bottom:1px solid #d9ded3';el('h3',m.product||'Item '+(i+1),box);if(m.photo){const im=el('img','',box);im.src=m.photo;im.alt=m.product||'Product';im.style.cssText='width:140px;height:140px;object-fit:contain'}if(m.description)el('p',m.description,box).className='description';el('p',m.metal+' Gold · '+(m.weight??'—')+' g',box);if(m.gold!==null){el('p','Gold Cost: '+money(m.gold,m),box);if(m.diamond>0)el('p','Diamond / Stone Cost: '+money(m.diamond,m),box);el('strong','Subtotal: '+money(m.gold+m.diamond,m),box);total+=m.gold+m.diamond}});el('h3','Total: '+money(total,order()[0]));$('cart').replaceChildren();items.forEach((m,i)=>{const row=document.createElement('p');row.textContent=(m.product||'产品 '+(i+1))+' · '+m.weight+'g ';const b=document.createElement('button');b.textContent='移除';b.className='secondary';b.onclick=()=>{items.splice(i,1);renderOrder()};row.appendChild(b);$('cart').appendChild(row)});renderRmb();$('image').replaceChildren();$('status').textContent=''}
function renderRmb(){const list=items.length?[...items]:[model()];if(items.length&&$('weight').value!=='')list.push(model());let gold=0,diamond=0,unknown=false;for(const m of list){let factor=m.base==='RMB'?1:m.currency==='RMB'?m.rate:null;if(factor===null){unknown=true;continue}gold+=(m.rawGold??0)*factor;diamond+=m.rawDiamond*factor}const box=$('rmbSummary');box.replaceChildren();const title=document.createElement('strong');title.textContent='内部人民币参考';box.appendChild(title);const p=document.createElement('p');p.style.cssText='margin:8px 0 0;font-size:14px';p.textContent=unknown?'非人民币输入暂无法计算人民币参考，请将输入金额币种选为 RMB，或将客户报价币种选为 RMB 并填写汇率。':'金料 RMB '+number(gold)+' · 钻石 RMB '+number(diamond);box.appendChild(p);if(!unknown){const total=document.createElement('strong');total.style.cssText='display:block;font-size:25px;color:#36523d;margin-top:8px';total.textContent='合计 RMB '+number(gold+diamond);box.appendChild(total)}}
$('photo').onchange=async()=>{const f=$('photo').files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{photoData=reader.result;$('photoPreview').src=photoData;$('photoPreview').hidden=false;if(!items.length)renderOrder()};reader.readAsDataURL(f)};
$('add').onclick=()=>{const m=model();if(m.weight===null||!m.ready){$('error').textContent='请填写实际克重、计价参数及需要的汇率。';return}if(items.length&&items[0].currency!==m.currency){$('error').textContent='同一张报价单请使用相同客户报价币种。';return}items.push(m);['product','weight','quoteWeight','diamond','carat','description','photo'].forEach(id=>$(id).value='');photoData='';$('photoPreview').hidden=true;$('error').textContent='';renderOrder()};
$('clear').onclick=()=>{items=[];photoData='';['customer','product','weight','quoteWeight','diamond','carat','description','photo'].forEach(id=>$(id).value='');$('photoPreview').hidden=true;renderOrder()};
$('export').onclick=async()=>{const list=order();if(list.some(m=>m.weight===null||!m.ready)){ $('status').textContent='请先补全报价信息。';return}renderOrder();const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),blocks=[];const add=(text,size=28,kind='body')=>{ctx.font=size+'px sans-serif';for(const para of text.split('\n')){let line='';for(const c of para){if(ctx.measureText(line+c).width>772){blocks.push({text:line,size,kind});line=''}line+=c}blocks.push({text:line,size,kind})}};add('Retail Quotation',46,'title');add(new Date().toLocaleDateString('en-GB'),24);if($('customer').value)add('Customer: '+$('customer').value);let total=0;for(const [i,m]of list.entries()){add(m.product||'Item '+(i+1),34,'product');if(m.photo){const im=new Image();im.src=m.photo;await im.decode();blocks.push({im})}if(m.description)add(m.description);add('Material: '+m.metal+' Gold');add('Gold Weight: '+m.weight+' g',30,'weight');add('Gold Cost: '+money(m.gold,m));if(m.diamond>0)add('Diamond / Stone Cost: '+money(m.diamond,m));add('Subtotal: '+money(m.gold+m.diamond,m),34,'subtotal');total+=m.gold+m.diamond;blocks.push({space:30})}add('Total: '+money(total,list[0]),44,'total');const height=128+blocks.reduce((n,b)=>n+(b.im?220:b.space||b.size*1.7),0);canvas.width=1800;canvas.height=height*2;ctx.scale(2,2);ctx.fillStyle='#fcfaf5';ctx.fillRect(0,0,900,height);ctx.fillStyle='#23433d';ctx.fillRect(0,0,900,12);let y=64;ctx.fillStyle='#292d29';ctx.textBaseline='top';for(const b of blocks){if(b.im){const ratio=Math.min(220/b.im.width,200/b.im.height);ctx.drawImage(b.im,64,y,b.im.width*ratio,b.im.height*ratio);y+=220}else if(b.space)y+=b.space;else{ctx.fillStyle=b.kind==='total'?'#ffffff':b.kind==='subtotal'?'#86621f':b.kind==='weight'?'#23433d':'#292d29';if(b.kind==='total'){ctx.fillStyle='#23433d';ctx.fillRect(40,y-12,820,b.size*1.7);ctx.fillStyle='#ffffff'}if(b.kind==='product'){ctx.fillStyle='#d4c7a5';ctx.fillRect(64,y-10,772,1);ctx.fillStyle='#23433d'}ctx.font=(['title','product','subtotal','total','weight'].includes(b.kind)?'600 ':'')+b.size+(b.kind==='title'?'px Georgia':'px sans-serif');ctx.fillText(b.text,64,y);y+=b.size*1.7}}const url=canvas.toDataURL('image/png'),im=new Image();im.src=url;im.alt='Retail quotation';$('image').replaceChildren(im);const a=document.createElement('a');a.href=url;a.download='retail-quotation.png';a.click();$('status').textContent='图片已生成，可下载或长按保存。'};
renderOrder();
</script></body></html>
